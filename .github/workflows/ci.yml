name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    name: Server tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the server
        run: python -m pip install -e ./server
      - name: Import the server
        run: python -c "import dungeondraft_mcp.server"
      - name: Offline unit tests
        run: python -m unittest discover -s server/tests
      - name: README translations match the English README
        run: python tools/check_readme_parity.py
  mod:
    name: Mod compiles (Godot 3.4.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Godot 3.4.2 headless binary
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/3.4.2-stable/Godot_v3.4.2-stable_linux_headless.64.zip
          unzip -q godot.zip
          chmod +x Godot_v3.4.2-stable_linux_headless.64
      - name: Compile-check the bridge script
        run: python3 tools/check_gdscript.py --godot ./Godot_v3.4.2-stable_linux_headless.64
      - name: Shared-history code against a stand-in for Dungeondraft's History
        run: python3 tools/test_mod_history.py --godot ./Godot_v3.4.2-stable_linux_headless.64
